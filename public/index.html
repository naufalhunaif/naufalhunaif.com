<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Galeri visual berbasis titik oleh Naufal Hunaif.">
  <title>Naufal Hunaif</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/site.css">
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/universe.js"></script>
</head>
<body>
  <main class="experience" aria-label="Galeri seni dot Naufal Hunaif">
    <div class="field" aria-hidden="true"></div>
    <div class="artwork" aria-live="polite">
      <canvas class="artwork-canvas is-visible" role="img" aria-label="Galaksi spiral yang dibentuk langsung dari titik putih"></canvas>
      <canvas class="artwork-canvas" role="img" aria-hidden="true"></canvas>
    </div>
    <div class="edge-shade" aria-hidden="true"></div>

    <div class="corner-mark" aria-hidden="true" data-dot-icon="mark"></div>
    <button class="corner-action" type="button" data-random aria-label="Tampilkan visual acak"><span data-dot-icon="shuffle" aria-hidden="true"></span></button>

    <div class="controls" aria-label="Kontrol galeri">
      <button class="control" type="button" data-prev aria-label="Visual sebelumnya"><span data-dot-icon="left" aria-hidden="true"></span></button>
      <div class="progress-dots" role="group" aria-label="Pilih visual"></div>
      <button class="control" type="button" data-next aria-label="Visual berikutnya"><span data-dot-icon="right" aria-hidden="true"></span></button>
      <button class="control control--pause" type="button" data-pause aria-label="Jeda animasi"><span data-dot-icon="pause" aria-hidden="true"></span></button>
    </div>
  </main>
</body>
</html>
